# XcodeGen spec — a regeneration path for ClaudeCodeAcademy.xcodeproj.
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# The .xcodeproj in this repo is hand-written and checked in, so you do NOT
# need XcodeGen to build the app. This file exists for two reasons: an
# .xcodeproj is nearly unreviewable in a diff, and if the project file ever
# gets into a broken state this regenerates a known-good one in a second.
#
# Keep the two in step. If you add a source file, add it in Xcode (which
# updates the .xcodeproj) — the `sources` globs below pick it up automatically
# on the next generate.

name: ClaudeCodeAcademy

options:
  bundleIdPrefix: com.claudecodeacademy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE

targets:
  ClaudeCodeAcademy:
    type: application
    platform: iOS

    sources:
      - path: ClaudeCodeAcademy
        excludes:
          # Info.plist is referenced through INFOPLIST_FILE, not compiled or
          # copied as a resource. Including it here would put a second copy
          # inside the bundle.
          - Info.plist

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudecodeacademy.course
        INFOPLIST_FILE: ClaudeCodeAcademy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone and iPad. Note this makes iPad screenshots mandatory in App
        # Store Connect — drop the 2 if you would rather ship iPhone-only.
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Left blank on purpose: set your team in Xcode, and never commit it.
        DEVELOPMENT_TEAM: ""
