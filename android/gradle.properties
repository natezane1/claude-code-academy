org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is not used anywhere in this app — the whole point of the WebView
# wrapper is that it builds from the platform SDK with no external dependency.
# Declared false so a stray transitive AndroidX artifact fails loudly rather
# than quietly enlarging the APK.
android.useAndroidX=false

# R8 is left at its default (on for release, off for debug). There is almost no
# Java here to shrink, but it also strips the unused platform stubs.
android.nonTransitiveRClass=true
