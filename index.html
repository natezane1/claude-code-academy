<title>Claude Code Academy — Coach Your Robot Crew</title>

<style>
  /* ============ TOKENS ============ */
  /* Dark is the default, deliberately — not a system-preference variant. The
     light palette below is still complete and correct; set data-theme="light"
     on <html> to use it. */
  :root {
    --paper:#0f1513; --card:#171f1c; --card-2:#212b26;
    --ink:#e7ebe8; --ink-soft:#a9b5ae; --ink-faint:#7d8a83; --line:#2c3833;
    --accent:#4fbf95; --accent-ink:#06231a; --accent-dim:#1c2f28;
    --score:#e8b23a; --score-bg:#33290f;
    --lred:#ef7d70; --lyellow:#e0b64a; --lgreen:#6ec98d; --llock:#6f6a61;

    --term-bg:#10161a; --term-bg-2:#171f24; --term-line:#2a353c;
    --term-ink:#d5e0e2; --term-faint:#7d8f95;
    --term-cyan:#66c6c0; --term-amber:#e0b64a; --term-green:#7fc98a; --term-red:#e77b6f;

    /* No webfonts on purpose: the Artifact CSP blocks font CDNs, so a linked
       face would fail silently. These are humanist stacks that resolve to a
       warm, characterful face on every platform. */
    --display:"Franklin Gothic Heavy","Arial Black","Arial Bold",Impact,Haettenschweiler,sans-serif;
    --body:Candara,Optima,"Gill Sans Nova","Gill Sans MT","Trebuchet MS",Cantarell,Ubuntu,"Segoe UI",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --r:6px;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.65);
  }
  :root[data-theme="light"] {
    --paper:#e9ebe8; --card:#f4f5f3; --card-2:#dfe3e0;
    --ink:#131a17; --ink-soft:#4a564f; --ink-faint:#77837b; --line:#c9cfca;
    --accent:#0b6e4f; --accent-ink:#ffffff; --accent-dim:#d7e5df;
    --score:#a9741a; --score-bg:#f5e4bd;
    --lred:#c0392b; --lyellow:#b07d0a; --lgreen:#2f7d4f; --llock:#8b8378;
    --shadow:0 1px 2px rgba(19,26,23,.09),0 8px 22px -12px rgba(19,26,23,.2);
  }

  /* ============ OVERALL SIZE ============ */
  /* One dial for the whole course. This scales text AND spacing together, so
     nothing gets cramped the way font-only scaling does. Change this single
     number to resize every page at once. */
  :root { zoom: 1.1; }

  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); font-size:18.7px; line-height:1.64;
    /* bold print throughout — secondary text is separated by colour, not weight */
    font-weight:700;
    -webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    padding-bottom:88px;
  }
  b, strong { font-weight:900; }
  h1,h2,h3,.display {
    font-family:var(--display); text-transform:uppercase;
    letter-spacing:-.015em; text-wrap:balance; line-height:1.02; margin:0; font-weight:900;
  }
  p { margin:0; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:2px; }
  .eyebrow {
    font-size:12.1px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint); font-family:var(--body);
  }

  /* ============ TOP RAIL ============ */
  .rail { position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line); }
  .rail-bar { height:3px; background:var(--card-2); }
  .rail-bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .3s ease; }
  .rail-in {
    max-width:1000px; margin:0 auto; padding:9px 20px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .chip {
    font-family:var(--mono); font-size:12.1px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; background:var(--accent-dim); color:var(--accent);
    padding:4px 9px; border-radius:3px;
  }
  .rail-in .count {
    margin-left:auto; font-family:var(--mono); font-size:13.2px; color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .rail-in .badges { font-family:var(--mono); font-size:13.2px; color:var(--score); font-weight:700; }

  /* ============ SLIDE ============ */
  .stage { max-width:1000px; margin:0 auto; padding:38px 20px 20px; }
  @media (max-width:700px) { .stage { padding-top:24px; } }
  .slide > * + * { margin-top:22px; }
  @media (prefers-reduced-motion: no-preference) {
    .slide { animation:in .3s ease both; }
    @keyframes in { from { opacity:0; transform:translateY(9px); } to { opacity:1; transform:none; } }
  }

  .slide h2 { font-size:clamp(33px,6.6vw,59.4px); }
  .slide h3 { font-size:clamp(24.2px,4.4vw,37.4px); }
  .lede { font-size:clamp(19.8px,2.64vw,24.2px); color:var(--ink-soft); max-width:60ch; }
  .body-txt { font-size:19.8px; max-width:62ch; color:var(--ink); }
  .body-txt + .body-txt { margin-top:12px; }
  .small { font-size:16.5px; color:var(--ink-faint); max-width:62ch; }

  /* cover slide */
  .cover { text-align:center; padding:20px 0 10px; }
  .cover h2 { font-size:clamp(41.8px,9.9vw,88px); }
  .cover h2 .em { color:var(--score); }
  .cover .lede { margin-left:auto; margin-right:auto; }
  .robot {
    font-size:clamp(61.6px,15.4vw,121px); line-height:1;
    filter:grayscale(.15);
  }

  /* level opener */
  .opener { border-left:5px solid var(--accent); padding:6px 0 6px 22px; }
  .opener .num {
    font-family:var(--display); font-size:clamp(52.8px,13.2vw,105.6px); color:var(--accent-dim);
    line-height:.85; letter-spacing:-.04em;
  }

  /* generic card */
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:20px 22px; box-shadow:var(--shadow);
  }
  .card > * + * { margin-top:12px; }

  .note {
    border-left:4px solid var(--score); background:var(--score-bg);
    border-radius:var(--r); padding:15px 18px;
  }
  .note .eyebrow { color:var(--score); display:block; margin-bottom:6px; }
  .note p { font-size:17.6px; }

  .alarm {
    border-left:4px solid var(--lred); background:var(--card);
    border:1px solid var(--line); border-left:4px solid var(--lred);
    border-radius:var(--r); padding:15px 18px;
  }
  .alarm .eyebrow { color:var(--lred); display:block; margin-bottom:6px; }
  .alarm p + p { margin-top:9px; }

  .grownup {
    border:2px dashed var(--line); border-radius:var(--r); padding:18px 20px; background:none;
  }
  .grownup .eyebrow { color:var(--ink-soft); display:block; margin-bottom:10px; }
  .grownup ul { margin:0; padding-left:20px; display:grid; gap:9px; }
  .grownup li { font-size:17.6px; }

  .word {
    display:inline-block; font-family:var(--mono); font-size:13.2px;
    background:var(--card-2); color:var(--ink-soft); border-radius:3px;
    padding:2px 7px; white-space:nowrap;
  }

  code.ic {
    font-family:var(--mono); font-size:.92em; background:var(--card-2);
    padding:2px 6px; border-radius:3px;
  }
  kbd {
    font-family:var(--mono); font-size:.86em; background:var(--card-2);
    border:1px solid var(--line); border-bottom-width:2px;
    border-radius:4px; padding:2px 7px; white-space:nowrap;
  }

  /* ============ DRAWN VISUALS ============ */
  .vis { display:grid; gap:14px; }

  /* mock terminal */
  .mock {
    background:var(--term-bg); border:1px solid var(--term-line); border-radius:var(--r);
    overflow:hidden; font-family:var(--mono); font-size:15.4px; color:var(--term-ink);
    box-shadow:var(--shadow);
  }
  .mock-bar {
    display:flex; align-items:center; gap:6px; padding:8px 11px;
    background:var(--term-bg-2); border-bottom:1px solid var(--term-line);
  }
  .mock-bar i { width:10px; height:10px; border-radius:50%; background:#3c4a52; flex:none; }
  .mock-bar span { font-size:12.1px; color:var(--term-faint); margin-left:6px; }
  .mock-body { padding:14px; display:grid; gap:5px; overflow-x:auto; }
  .mock-body .l { white-space:pre; }
  .mock .cy { color:var(--term-cyan); }
  .mock .gr { color:var(--term-green); }
  .mock .am { color:var(--term-amber); }
  .mock .fa { color:var(--term-faint); }
  .mock .rd { color:var(--term-red); }
  .mock-strip {
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:9px 13px; border-top:1px solid var(--term-line); background:var(--term-bg-2);
    font-size:13.2px; color:var(--term-faint);
  }
  .mock-strip b { color:var(--term-ink); font-weight:400; }

  /* callouts under a mock */
  .callouts { display:grid; gap:9px; }
  .co {
    display:grid; grid-template-columns:26px 1fr; gap:11px; align-items:start;
    font-size:17.6px;
  }
  .co .n {
    width:24px; height:24px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    font-family:var(--mono); font-size:13.2px; font-weight:700; display:grid; place-items:center;
    flex:none; margin-top:2px;
  }
  .co b { font-weight:700; }
  .co span { color:var(--ink-soft); }
  .pin {
    display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%;
    background:var(--accent); color:var(--accent-ink);
    font-family:var(--mono); font-size:12.1px; font-weight:700; vertical-align:middle;
  }

  /* flow diagram */
  .flow { display:flex; align-items:stretch; gap:0; flex-wrap:wrap; }
  .fstep {
    flex:1 1 150px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r); padding:15px; text-align:center;
  }
  .fstep .ico { font-size:35.2px; line-height:1; }
  .fstep b { display:block; margin-top:9px; font-size:17.6px; }
  .fstep span { font-size:15.4px; color:var(--ink-soft); }
  .farrow {
    flex:0 0 34px; display:grid; place-items:center;
    font-family:var(--mono); color:var(--ink-faint); font-size:22px;
  }
  @media (max-width:640px) {
    .farrow { flex-basis:100%; height:26px; transform:rotate(90deg); }
  }

  /* traffic lights */
  .lights { display:grid; gap:11px; }
  .lt {
    display:grid; grid-template-columns:auto 1fr; gap:15px; align-items:start;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px;
  }
  .lt .orb {
    width:34px; height:34px; border-radius:50%; flex:none;
    display:grid; place-items:center; font-size:16.5px; color:#fff; font-weight:700;
  }
  .lt.red .orb { background:var(--lred); }
  .lt.yellow .orb { background:var(--lyellow); }
  .lt.green .orb { background:var(--lgreen); }
  .lt.lock .orb { background:var(--llock); }
  .lt.lock { border-style:dashed; }
  .lt .tag { font-size:12.1px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .lt.red .tag { color:var(--lred); }
  .lt.yellow .tag { color:var(--lyellow); }
  .lt.green .tag { color:var(--lgreen); }
  .lt.lock .tag { color:var(--llock); }
  .lt b { display:block; font-size:20.9px; margin-top:3px; }
  .lt span { font-size:17.6px; color:var(--ink-soft); }

  /* backpack meters */
  .packs { display:grid; gap:12px; }
  .pack { display:grid; grid-template-columns:1fr; gap:7px; }
  .pack .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .pack .top b { font-size:17.6px; }
  .pack .top span { font-family:var(--mono); font-size:14.3px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .meter { height:16px; background:var(--card-2); border-radius:8px; overflow:hidden; }
  .meter i { display:block; height:100%; border-radius:8px; }
  .meter.ok i { background:var(--lgreen); }
  .meter.mid i { background:var(--lyellow); }
  .meter.bad i { background:var(--lred); }
  .pack .cap { font-size:16.5px; color:var(--ink-soft); }

  /* keycaps row */
  .keys { display:grid; gap:11px; }
  .keyrow {
    display:grid; grid-template-columns:auto 1fr; gap:15px; align-items:center;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 17px;
  }
  .keyrow .cap {
    font-family:var(--mono); font-size:22px; font-weight:700;
    background:var(--paper); border:1px solid var(--line); border-bottom-width:3px;
    border-radius:6px; padding:8px 14px; min-width:52px; text-align:center; color:var(--ink);
  }
  .keyrow b { display:block; font-size:18.7px; }
  .keyrow span { font-size:16.5px; color:var(--ink-soft); }

  /* copy command */
  .cmd { display:flex; background:var(--term-bg); border:1px solid var(--term-line); border-radius:var(--r); overflow:hidden; }
  .cmd code { font-family:var(--mono); font-size:15.4px; color:var(--term-ink); padding:13px 15px; overflow-x:auto; white-space:pre; flex:1; }
  .cmd button {
    font:inherit; font-size:12.1px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    background:var(--term-bg-2); color:var(--term-cyan); border:0; border-left:1px solid var(--term-line);
    padding:0 15px; cursor:pointer; min-width:82px;
  }
  .cmd button:hover { background:var(--accent); color:var(--accent-ink); }
  .cmd-label { display:block; margin-bottom:6px; }

  /* ============ DUGOUT ============ */
  .dugout { background:var(--term-bg); border:1px solid var(--term-line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); }
  .dug-top { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 13px; background:var(--term-bg-2); border-bottom:1px solid var(--term-line); }
  .dug-top .lbl { font-family:var(--mono); font-size:12.1px; letter-spacing:.1em; text-transform:uppercase; color:var(--term-amber); font-weight:700; }
  .dug-top .fake { font-size:12.1px; color:var(--term-faint); }
  .backpack { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .backpack .bl { font-size:12.1px; color:var(--term-faint); font-family:var(--mono); }
  .bar { width:80px; height:7px; background:#263137; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--term-green); width:6%; transition:width .35s ease; }
  .bar.warn i { background:var(--term-amber); }
  .bar.hot i { background:var(--term-red); }
  .backpack .pct { font-family:var(--mono); font-size:12.1px; color:var(--term-ink); font-variant-numeric:tabular-nums; min-width:32px; text-align:right; }
  .goal { padding:11px 13px; background:#1b2a22; border-bottom:1px solid var(--term-line); font-size:15.4px; color:#cfe6d7; display:flex; gap:10px; }
  .goal .g { font-family:var(--mono); font-size:12.1px; letter-spacing:.1em; text-transform:uppercase; color:var(--term-green); font-weight:700; flex:none; padding-top:3px; }
  .goal .hint { display:block; margin-top:7px; color:var(--term-amber); font-size:14.3px; }
  .screen { font-family:var(--mono); font-size:14.85px; line-height:1.55; color:var(--term-ink); padding:13px; height:250px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; }
  .screen .u { color:var(--term-cyan); }
  .screen .sys { color:var(--term-faint); }
  .screen .ok { color:var(--term-green); }
  .screen .warn { color:var(--term-amber); }
  .screen .err { color:var(--term-red); }
  .screen .ln { margin:0; }
  .screen .blk { margin:6px 0; }
  .dug-input { display:flex; align-items:center; gap:9px; padding:10px 13px; border-top:1px solid var(--term-line); background:var(--term-bg-2); }
  .dug-input .caret { font-family:var(--mono); color:var(--term-green); font-weight:700; flex:none; }
  .dug-input input { flex:1; background:none; border:0; color:var(--term-ink); font-family:var(--mono); font-size:15.4px; padding:6px 0; min-height:32px; }
  .dug-input input::placeholder { color:#5c6b71; }
  .dug-input input:focus { outline:none; }
  .dug-input:focus-within { box-shadow:inset 0 0 0 2px var(--accent); }
  .dug-foot { display:flex; gap:14px; flex-wrap:wrap; align-items:center; padding:8px 13px; border-top:1px solid var(--term-line); }
  .mode-chip { display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:12.65px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
  .mode-chip .orb { width:10px; height:10px; border-radius:50%; flex:none; }
  .mode-chip.red { color:#ef7d70; } .mode-chip.red .orb { background:#ef7d70; }
  .mode-chip.yellow { color:#e0b64a; } .mode-chip.yellow .orb { background:#e0b64a; }
  .mode-chip.green { color:#6ec98d; } .mode-chip.green .orb { background:#6ec98d; }
  .keyhint { font-family:var(--mono); font-size:12.65px; color:var(--term-faint); }
  .keyhint kbd { font-family:var(--mono); background:#263137; border:0; border-radius:3px; padding:1px 5px; color:var(--term-ink); font-size:12.1px; }

  /* stamp */
  .stamp {
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--display); text-transform:uppercase; font-size:18.7px; letter-spacing:.03em;
    color:var(--accent); background:var(--accent-dim); border-radius:var(--r); padding:12px 18px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .stamp.pop { animation:pop .45s cubic-bezier(.2,1.5,.4,1) both; }
    @keyframes pop { from { transform:scale(.6) rotate(-6deg); opacity:0; } to { transform:none; opacity:1; } }
  }
  .badge-list { display:flex; gap:9px; flex-wrap:wrap; }
  .bpill {
    font-size:15.4px; font-weight:600; background:var(--card); border:1px solid var(--line);
    border-radius:99px; padding:7px 14px; color:var(--ink-soft);
  }
  .bpill.got { background:var(--accent-dim); color:var(--accent); border-color:transparent; }

  /* ============ BOTTOM NAV ============ */
  .nav {
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--paper); border-top:1px solid var(--line);
  }
  .nav-in {
    max-width:1000px; margin:0 auto; padding:12px 20px;
    display:flex; align-items:center; gap:12px;
  }
  .btn {
    font:inherit; font-size:17.6px; font-weight:700; border:0; border-radius:var(--r);
    padding:13px 24px; cursor:pointer; min-height:48px;
    background:var(--accent); color:var(--accent-ink);
  }
  .btn:hover { filter:brightness(1.08); }
  .btn.sec { background:var(--card); color:var(--ink-soft); border:1px solid var(--line); }
  .btn.sec:hover { filter:none; border-color:var(--accent); color:var(--accent); }
  .btn[disabled] { opacity:.4; cursor:not-allowed; filter:none; }
  .nav-in .spacer { flex:1; }
  .nav-in .next { margin-left:auto; }
  .dots { display:flex; gap:4px; flex-wrap:nowrap; overflow:hidden; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--card-2); flex:none; }
  .dot.on { background:var(--accent); }
  .dot.seen { background:var(--ink-faint); }
  @media (max-width:640px) { .dots { display:none; } }

  .reset {
    font:inherit; font-size:14.3px; background:none; border:0; color:var(--ink-faint);
    text-decoration:underline; cursor:pointer; padding:10px 6px; min-height:44px;
  }

  /* ============ LEVEL TABS ============ */
  .tabs {
    max-width:1000px; margin:0 auto; padding:0 20px 9px;
    display:flex; align-items:center; gap:4px; overflow-x:auto;
    scrollbar-width:thin;
  }
  .tabs::-webkit-scrollbar { height:5px; }
  .tabs::-webkit-scrollbar-thumb { background:var(--line); border-radius:3px; }
  .tab {
    flex:none; min-width:36px; height:36px; padding:0 7px;
    font:inherit; font-family:var(--mono); font-size:13.75px; font-weight:700;
    background:var(--card); border:1px solid var(--line); border-radius:5px;
    color:var(--ink-soft); cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:3px;
  }
  .tab:hover { border-color:var(--accent); color:var(--accent); }
  .tab.on { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .tab.got:not(.on) { border-color:var(--accent); color:var(--accent); }
  .tab .st { font-size:9.9px; line-height:1; }
  .tab.rc { font-family:var(--body); font-size:12.1px; letter-spacing:.06em; text-transform:uppercase; }

  /* ============ MISSION ============ */
  .done-box {
    border-left:4px solid var(--lgreen); background:var(--card);
    border:1px solid var(--line); border-left:4px solid var(--lgreen);
    border-radius:var(--r); padding:15px 18px;
  }
  .done-box .eyebrow { color:var(--lgreen); display:block; margin-bottom:6px; }
  .done-box p { font-size:17.6px; }
  .mission-tag {
    display:inline-block; font-size:12.1px; font-weight:700; letter-spacing:.12em;
    text-transform:uppercase; color:var(--score); background:var(--score-bg);
    padding:5px 11px; border-radius:99px;
  }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const say = m => { document.getElementById("live").textContent = m; };

/* a copyable command box */
function cmdEl(label, cmd) {
  const w = el("div");
  if (label) w.append(el("span","eyebrow cmd-label",label));
  const c = el("div","cmd",`<code>${esc(cmd)}</code>`);
  const b = el("button",null,"Copy"); b.type = "button";
  b.onclick = async () => {
    try { await navigator.clipboard.writeText(cmd); b.textContent = "Copied"; }
    catch (e) { b.textContent = "Select it"; }
    setTimeout(() => { b.textContent = "Copy"; }, 1600);
  };
  c.append(b); w.append(c);
  return w;
}

    s.append(el("p","body-txt", m.lead));

}

add({ lv:4, kind:"idea", build: s => {

  s.append(el("p","body-txt","Everything so far has been harmless. This is the slide where that changes."));
  s.append(el("p","body-txt","The robot can change real files and run real commands on a real computer. That is exactly why it is useful — and exactly why you need a way to hold it back."));
  s.append(el("div","alarm",`<span class="eyebrow">The honest version</span><p>In one of the courses this material came from, a person ran their robot with all the asking switched off. It ran a delete command and wiped their machine. Nothing in this course needs that setting.</p>`));
}});

add({ lv:4, kind:"idea", build: s => {

  s.append(el("div","vis",VIS.shiftTab()));

add({ lv:4, kind:"idea", build: s => {

  s.append(el("p","body-txt","Here is the rule underneath all three lights. The robot never asks before it <i>reads</i> something — reading cannot break anything, so it just gets on with it. The moment it wants to <i>change</i> a file, or run a command on your computer, it stops and asks."));
  s.append(el("p","body-txt",`A command is an instruction typed straight to the computer rather than to the robot — the install line you pasted in Level 1 was one.`));
  s.append(el("p","small","So when you watch it read six files without a word and then suddenly halt, nothing has gone wrong. It just reached the first thing that touches something."));
}});

/* ---------- dugout ---------- */
const MODES = [
  { key:"red",    name:"Ask first",    chip:"ASK FIRST" },
  { key:"yellow", name:"Accept edits", chip:"ACCEPT EDITS" },
  { key:"green",  name:"Plan only",    chip:"PLAN ONLY" }
];

class Dugout {
  constructor(ch, onSolve) {
    this.ch = ch; this.onSolve = onSolve;
    this.modeIdx = 0; this.pack = 6; this.history = []; this.hIdx = -1;
    this.misses = 0; this.solved = false; this.verbose = false; this.lastEsc = 0;
    this.root = this.build(); this.boot();
  }
  build() {
    const r = el("div","dugout");
    const top = el("div","dug-top");
    top.append(el("span","lbl","Practice dugout"), el("span","fake","a drawing — nothing here is real"));
    const pk = el("div","backpack",`<span class="bl">backpack</span><span class="bar"><i></i></span><span class="pct">6%</span>`);
    top.append(pk); r.append(top);
    this.bar = pk.querySelector(".bar"); this.fill = pk.querySelector("i"); this.pctEl = pk.querySelector(".pct");

    this.goalEl = el("div","goal",`<span class="g">Goal</span><span class="gt">${this.ch.goal}</span>`);
    r.append(this.goalEl);

    this.screen = el("div","screen");
    this.screen.setAttribute("role","log"); this.screen.tabIndex = 0;
    r.append(this.screen);

    const row = el("div","dug-input");
    row.append(el("span","caret",">"));
    this.input = el("input"); this.input.type = "text";
    this.input.placeholder = "type here, then press Enter";
    this.input.setAttribute("aria-label","Practice terminal input");
    this.input.autocomplete = "off"; this.input.spellcheck = false;
    row.append(this.input); r.append(row);

    const foot = el("div","dug-foot");
    this.chip = el("span","mode-chip red");
    foot.append(this.chip, el("span","keyhint",`<kbd>Shift</kbd>+<kbd>Tab</kbd> light · <kbd>↑</kbd> history · <kbd>Esc</kbd><kbd>Esc</kbd> clear`));
    r.append(foot);
    this.paintMode();

    this.input.addEventListener("keydown", e => this.key(e));
    /* Shift+Tab cycles the light, but only while the input has focus, so the
       transcript above can still be reverse-tabbed out of by keyboard. */
    this.input.addEventListener("keydown", e => {
      if (e.key === "Tab" && e.shiftKey) { e.preventDefault(); this.cycle(); }
    });
    return r;
  }
  boot() {
    this.p("Claude Code (practice)  ·  folder: ~/my-first-project","sys");
    this.p("Type /help to see what you can do. Nothing here touches your real computer.","sys");
  }
  p(t,c) { const e = el("p","ln"+(c?" "+c:""),t); this.screen.append(e); this.screen.scrollTop = 1e6; }
  blk(ls,c) { const d = el("div","blk"); ls.forEach(l => d.append(el("p","ln"+(c?" "+c:""),l))); this.screen.append(d); this.screen.scrollTop = 1e6; }
  paintMode() { const m = MODES[this.modeIdx]; this.chip.className = "mode-chip "+m.key; this.chip.innerHTML = `<span class="orb"></span>${m.chip}`; }
  cycle() {
    this.modeIdx = (this.modeIdx+1) % MODES.length;
    const m = MODES[this.modeIdx];
    this.paintMode(); this.p(`— light switched to <b>${m.name}</b> —`,"warn"); say("Light is now "+m.name);
    if (this.modeIdx === 0) this.p("(the fourth light, with no asking at all, is locked in this course)","sys");
    if (this.ch.mode && !this.solved && m.key === this.ch.mode) this.win();
  }
  addPack(n) { this.pack = Math.min(99, this.pack+n); this.paint(); }
  paint() {
    this.fill.style.width = this.pack+"%"; this.pctEl.textContent = this.pack+"%";
    this.bar.className = "bar"+(this.pack>75?" hot":this.pack>45?" warn":"");
  }
  key(e) {
    if (e.key === "Enter") { e.preventDefault(); const v = this.input.value; this.input.value = ""; this.run(v); return; }
    if (e.key === "Escape") { const n = Date.now(); if (n-this.lastEsc < 700) { this.input.value = ""; this.p("— cleared —","sys"); } this.lastEsc = n; return; }
    if (e.key === "ArrowUp") { e.preventDefault(); if (!this.history.length) return; this.hIdx = Math.min(this.hIdx+1, this.history.length-1); this.input.value = this.history[this.hIdx]; return; }
    if (e.key === "ArrowDown") { e.preventDefault(); this.hIdx = Math.max(this.hIdx-1,-1); this.input.value = this.hIdx === -1 ? "" : this.history[this.hIdx]; return; }
    if (e.key === "o" && e.ctrlKey) { e.preventDefault(); this.verbose = !this.verbose; this.p(`— thinking log ${this.verbose?"on":"off"} —`,"sys"); }
  }
  run(raw) {
    const v = raw.trim(); if (!v) return;
    this.history.unshift(v); this.hIdx = -1;
    this.p(`<span class="u">&gt; ${esc(v)}</span>`); this.addPack(2);
    this.respond(v);
    if (this.ch.accept && !this.solved) {
      if (this.ch.accept.some(rx => rx.test(v))) this.win(); else this.miss();
    }
  }
  respond(v) {
    const lo = v.toLowerCase();
    if (v === "/" || lo === "/help") return this.blk([
      "<b>Commands you can try in here</b>",
      "  /help      show this list",
      "  /context   see how full the backpack is",
      "  /compact   squash the chat to make room",
      "  /model     choose which brain to use",
      "  /init      write the robot a notebook",
      "  /agents    see your teammates",
      "  /clear     start the chat over",
      "  /login     sign in",
      "  /exit      leave",
      "",
      "  @file.txt  point at a file",
      "  !ls        run a plain computer command",
      "<span class='sys'>Practice list. The real /help is much longer.</span>"]);
    if (lo === "/login") return this.blk(["Opening your browser to sign in…","<span class='ok'>✓ Signed in as you@example.com  (pretend)</span>"]);
    if (lo === "/context") return this.blk([
      "<b>What is in the backpack right now</b>",
      "  the robot's instructions ....... 12,400",
      "  its built-in tools ............. 17,100",
      "  the notebook (CLAUDE.md) ....... 0  <span class='sys'>← none yet, that is Level 7</span>",
      `  this conversation .............. ${(this.pack*1200).toLocaleString()}`,
      `  <span class='ok'>free space .................... ${100-this.pack}%</span>`]);
    if (lo === "/compact") {
      const b = this.pack; this.pack = Math.max(6, Math.round(this.pack*0.35)); this.paint();
      return this.blk(["Squashing the chat into a shorter summary…",
        `<span class='ok'>✓ backpack went from ${b}% to ${this.pack}%</span>`,
        "<span class='sys'>It keeps the gist and forgets the exact words.</span>"]);
    }
    if (lo.startsWith("/model")) return this.blk([
      "<b>Which brain?</b>",
      "  1. Opus    — the big careful one. Costs the most.",
      "  2. Sonnet  — the everyday one. Most people live here.",
      "  3. Haiku   — the quick cheap one. Good for small jobs.",
      "<span class='sys'>Level 10 covers when to pick which.</span>"]);
    if (lo === "/init") return this.blk(["Reading every file in this folder…","<span class='ok'>✓ Wrote CLAUDE.md</span>",
      "<span class='sys'>That file is the notebook. It gets read every single time the robot starts. Level 7.</span>"]);
    if (lo === "/agents") return this.blk(["<b>Your teammates</b>","  (none yet)",
      "<span class='sys'>In Level 10 you hire three: a researcher, a reviewer and a tester.</span>"]);
    if (lo.startsWith("/goal")) {
      const rest = v.slice(5).trim();
      if (!rest) return this.blk(["<b>/goal</b> — keep going until a condition is met.",
        "<span class='sys'>Give it three things: a finish line (“until…”), a way to prove it, and a guardrail (“stop after N turns”).</span>",
        "<span class='sys'>Try: /goal tidy the folder until no files are left, stop after 20 turns</span>"]);
      const hasUntil = /until/i.test(rest), hasStop = /stop after/i.test(rest);
      const out = ["<span class='sys'>starting a loop…</span>",
        "turn 1  looked around, found 17 things to do",
        "turn 2  did 6 of them … 11 left",
        "turn 3  did 7 of them … 4 left",
        "turn 4  did 4 of them … 0 left"];
      if (hasUntil) out.push("<span class='am'>turn 5  checking the finish line… nothing left</span>",
        "<span class='ok'>✓ goal achieved</span>");
      else out.push("<span class='err'>…and it keeps going, because you never said when to stop.</span>",
        "<span class='sys'>Add a finish line: “…until there are none left”.</span>");
      if (hasStop) out.push("<span class='sys'>(guardrail noted — it would have given up rather than loop forever)</span>");
      else out.push("<span class='warn'>⚠ no give-up number. Always add “stop after N turns”.</span>");
      this.addPack(6);
      return this.blk(out);
    }
    if (lo.startsWith("/rewind")) return this.blk(["Going back to before the last mistake…",
      "<span class='ok'>✓ rewound. The bad turn is gone from the chat.</span>",
      "<span class='sys'>Much better than arguing — the bad ideas are not left lying around.</span>"]);
    if (lo.startsWith("/plugin")) {
      const arg = v.slice(7).trim();
      if (/^marketplace\s+add\s+\S/i.test(arg)) {
        const shop = arg.replace(/^marketplace\s+add\s+/i, "");
        return this.blk([`Adding marketplace <b>${esc(shop)}</b>…`,
          "<span class='ok'>✓ shop added</span>",
          `<span class='sys'>Now install something from it: /plugin install &lt;name&gt;@&lt;shop&gt;</span>`]);
      }
      if (/^install\s+\S/i.test(arg)) return this.blk([`Installing <b>${esc(arg.replace(/^install\s+/i,""))}</b>…`,
        "<span class='ok'>✓ installed — its commands are available now</span>",
        "<span class='sys'>Its skills load only when they are needed.</span>"]);
      if (/^list/i.test(arg)) return this.blk(["<b>Installed plugins</b>","  watch-skill@watch-skill   <span class='gr'>enabled</span>",
        "<span class='sys'>Real machines often have far more. That is the problem Level 9 warns about.</span>"]);
      return this.blk(["<b>/plugin</b> — manage superpower packs.",
        "  /plugin marketplace add &lt;owner&gt;/&lt;repo&gt;","  /plugin install &lt;name&gt;@&lt;shop&gt;",
        "  /plugin list","  /plugin uninstall &lt;name&gt;@&lt;shop&gt;"]);
    }
    if (lo === "/clear") { this.screen.innerHTML = ""; this.pack = 6; this.paint(); this.boot();
      return this.p("<span class='ok'>✓ Fresh start. The robot has forgotten this chat.</span>"); }
    if (lo === "/exit" || lo === "/quit") return this.blk(["Goodbye.",
      "<span class='sys'>In the real thing you would be back at your plain terminal — and it would remember nothing next time. That is what the notebook in Level 7 fixes.</span>"]);
    if (v.startsWith("/")) return this.blk([`<span class='err'>Unknown command: ${esc(v)}</span>`,"<span class='sys'>Type / on its own to see the list.</span>"]);
    if (v.startsWith("!")) return this.blk(["<span class='sys'>running a plain computer command (pretend)</span>",
      "hello.txt   notes.md   my-game/","<span class='sys'>! means: skip the robot, talk straight to the computer.</span>"]);
    if (v.startsWith("@")) return this.blk([`<span class='sys'>pointing the robot at ${esc(v.slice(1)||"a file")}</span>`,"<span class='ok'>✓ It can see that file now.</span>"]);

    if (this.verbose) this.p("<span class='sys'>(thinking… deciding whether this needs a file change)</span>");
    const m = MODES[this.modeIdx];
    if (m.key === "green") return this.blk([
      "I will not change anything yet — the light is on <b>Plan only</b>. Here is what I would do:",
      "  1. make the file","  2. put your words in it","  3. show you the result so you can check it",
      "<span class='sys'>Switch the light to carry it out.</span>"]);
    if (m.key === "red") return this.blk(["Okay. To do that I need to create <b>hello.txt</b>.",
      "<span class='warn'>May I? [y / n]</span>",
      "<span class='sys'>The light is on Ask first, so I stop and check with you.</span>"]);
    return this.blk(["Okay — working…","<span class='ok'>✓ Done.</span>",
      "<span class='sys'>The light is on Accept edits, so I got on with it. Now <b>you</b> check my work.</span>"]);
  }
  win() {
    this.solved = true;
    this.goalEl.querySelector(".g").textContent = "Done";
    this.goalEl.querySelector(".gt").innerHTML =
      "<b>Nice — that is exactly it.</b> " + (this.ch.tip ? this.ch.tip + " " : "") + "Keep playing as long as you like, then press Next.";
    this.p("<span class='ok'>★ challenge complete</span>"); say("Challenge complete");
    this.onSolve();
  }
  miss() {
    if (!this.ch.hints) return;
    this.misses++; if (this.misses < 2) return;
    let h = this.goalEl.querySelector(".hint");
    if (!h) { h = el("span","hint"); this.goalEl.querySelector(".gt").append(h); }
    h.innerHTML = "Hint: " + this.ch.hints[Math.min(this.misses-2, this.ch.hints.length-1)];
    say("Hint shown");
  }
}

/* ---------- state ---------- */
const KEY = "cc-academy-deck-v1";
let st = { i:0, badges:[], solved:[] };
try {
  const r = localStorage.getItem(KEY);
  if (r) {
    const p = JSON.parse(r);
    st = {
      i: Number.isInteger(p.i) ? p.i : 0,
      badges: Array.isArray(p.badges) ? p.badges.filter(Number.isInteger) : [],
      solved: Array.isArray(p.solved) ? p.solved.filter(Number.isInteger) : []
    };
  }
} catch (e) { /* corrupt or unavailable storage — start fresh rather than break */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

/* ---------- render ---------- */
function draw() {
  const i = Math.max(0, Math.min(st.i, S.length-1));
  st.i = i; save();
  const sl = S[i];
  const host = document.getElementById("slide");
  host.innerHTML = "";
  host.className = "";
  void host.offsetWidth;      /* force a reflow so the entrance animation replays */
  host.className = "slide";

  sl.build(host);

  if (sl.kind === "practice") {
    const d = new Dugout(sl.ch || sl.challenge, () => {
      if (!st.solved.includes(i)) { st.solved.push(i); save(); }
    });
    if (sl.challenge && st.solved.includes(i)) { /* re-entry: leave fresh, it is practice */ }
    host.append(d.root);
    setTimeout(() => d.input.focus(), 60);
  }

  if (sl.kind === "recap" || sl.kind === "end") {
    const b = BADGES.find(x => x.lv === sl.badge);
    if (b) {
      /* a badge is earned by doing the practice, not by reaching this slide */
      const sec = SECTIONS.find(x => x.lv === sl.lv);
      const practices = sec ? sec.idx.filter(k => S[k].kind === "practice") : [];
      const earned = practices.length === 0 || practices.every(k => st.solved.includes(k));
      if (earned) {
        if (!st.badges.includes(b.lv)) { st.badges.push(b.lv); save(); }
        host.append(el("div","stamp pop",`★ Badge earned — ${b.name}`));
      } else {
        host.append(el("div","note",
          `<span class="eyebrow">One thing left</span><p>Go back a slide and finish the practice, and “${b.name}” is yours. You can carry on without it if you would rather — nothing is locked.</p>`));
      }
    }
    const list = el("div","badge-list");
    BADGES.forEach(x => list.append(el("span","bpill"+(st.badges.includes(x.lv)?" got":""),
      (st.badges.includes(x.lv)?"★ ":"○ ")+x.name)));
    host.append(list);
  }

  /* rail */
  document.getElementById("chipLevel").textContent = LV[sl.lv];
  document.getElementById("chipCount").textContent = `${i+1} / ${S.length}`;
  document.getElementById("chipBadges").textContent = st.badges.length ? "★".repeat(st.badges.length) : "";
  document.getElementById("railFill").style.width = ((i+1)/S.length*100)+"%";
  renderTabs();

  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  S.forEach((_, k) => dots.append(el("span","dot"+(k===i?" on":k<i?" seen":""))));

  document.getElementById("backBtn").disabled = i === 0;
  const nb = document.getElementById("nextBtn");
  nb.textContent = i === S.length-1 ? "Start again" : "Next →";

  window.scrollTo({ top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  say(`Slide ${i+1} of ${S.length}. ${LV[sl.lv]}`);
}

const go = n => { st.i = n < 0 ? 0 : n >= S.length ? 0 : n; draw(); };
document.getElementById("nextBtn").onclick = () => go(st.i+1);
document.getElementById("backBtn").onclick = () => go(st.i-1);

/* ==========================================================
   LEVEL TABS — one button per level, in reading order.
   `lv` values are label lookups, so the four act recaps sit
   at the end of LV but appear here in their true reading order.
   The acts still shape the order and the recaps, but they are
   not labelled here: the strip is just the numbers.
   ========================================================== */
const TAB_ORDER = [
  { lv:0,  label:"W",  name:"Welcome" },
  { lv:1,  label:"0" }, { lv:2,  label:"1" }, { lv:3,  label:"2" },
  { lv:16, label:"Recap", rc:true },
  { lv:4,  label:"3" }, { lv:5,  label:"4" }, { lv:6,  label:"5" },
  { lv:7,  label:"6" }, { lv:8,  label:"7" },
  { lv:17, label:"Recap", rc:true },
  { lv:9,  label:"8" },
  { lv:18, label:"Recap", rc:true },
  { lv:10, label:"9" }, { lv:11, label:"10" }, { lv:12, label:"11" },
  { lv:13, label:"12" }, { lv:14, label:"13" },
  { lv:19, label:"Recap", rc:true },
  { lv:15, label:"★", name:"What's next" }
];

function renderTabs() {
  const host = document.getElementById("tabs");
  host.innerHTML = "";
  const curLv = S[st.i].lv;

  TAB_ORDER.forEach(t => {
    const sec = SECTIONS.find(x => x.lv === t.lv);
    if (!sec) return;
    const badge = BADGES.find(x => x.lv === t.lv);
    const got = badge && st.badges.includes(badge.lv);
    const on = t.lv === curLv;

    const b = el("button", "tab" + (on ? " on" : "") + (got ? " got" : "") + (t.rc ? " rc" : ""));
    b.type = "button";
    b.innerHTML = esc(t.label) + (got && !t.rc ? `<span class="st">★</span>` : "");
    b.title = LV[t.lv];
    b.setAttribute("aria-label", LV[t.lv] + (got ? " — badge earned" : ""));
    if (on) b.setAttribute("aria-current", "true");
    b.onclick = () => go(sec.idx[0]);
    host.append(b);
  });

  const active = host.querySelector(".tab.on");
  if (active && active.scrollIntoView) active.scrollIntoView({ block:"nearest", inline:"center" });
}

const scrim = document.getElementById("scrim");
const sheet = document.getElementById("sheet");
const menuBtn = document.getElementById("menuBtn");

document.addEventListener("keydown", e => {
  const a = document.activeElement;
  if (/^(INPUT|TEXTAREA)$/.test(a.tagName)) return;
  if (a.closest && a.closest(".dugout")) return;   /* let the terminal scroll with Space */
  if (e.key === "Escape" && scrim.classList.contains("open")) { closeMenu(); return; }
  if (scrim.classList.contains("open")) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(st.i+1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(st.i-1); }
});

/* ==========================================================
   SECTIONS MENU
   Slide titles are read out of each slide's own heading, so
   the menu can never drift out of step with the content.
   ========================================================== */
const TITLES = S.map((sl, k) => {
  const probe = document.createElement("div");
  try { sl.build(probe); } catch (e) { /* ignore, fall back to level name */ }
  const h = probe.querySelector("h2, h3");
  let t = h ? h.textContent.trim() : "";
  if (!t) t = LV[sl.lv];
  if (sl.kind === "practice") t = "Your turn";
  return t;
});

/* group slide indices by section, preserving order */
const SECTIONS = [];
S.forEach((sl, k) => {
  const last = SECTIONS[SECTIONS.length-1];
  if (last && last.lv === sl.lv) last.idx.push(k);
  else SECTIONS.push({ lv: sl.lv, idx: [k] });
});

function buildMenu() {
  const host = document.getElementById("secList");
  host.innerHTML = "";
  const curLv = S[st.i].lv;

  SECTIONS.forEach(sec => {
    const wrap = el("div", "sec" + (sec.lv === curLv ? " on" : ""));
    const badge = BADGES.find(b => b.lv === sec.lv);
    const got = badge && st.badges.includes(badge.lv);
    const isHere = sec.lv === curLv;

    const b = el("button", "sec-btn");
    b.type = "button";
    b.setAttribute("aria-expanded", isHere ? "true" : "false");
    b.innerHTML =
      `<span class="mark${got ? " got" : ""}${isHere ? " here" : ""}">${got ? "★" : sec.idx.length}</span>` +
      `<span class="nm">${LV[sec.lv]}</span>` +
      `<span class="ct">${sec.idx.length} slide${sec.idx.length === 1 ? "" : "s"}</span>`;
    b.onclick = () => { closeMenu(); go(sec.idx[0]); };
    wrap.append(b);

    /* the current section shows its slides so you can jump inside it */
    if (isHere) {
      const ul = el("ul", "subs");
      sec.idx.forEach(k => {
        const li = el("li");
        const sb = el("button", "sub-btn" + (k === st.i ? " on" : ""));
        sb.type = "button";
        sb.innerHTML =
          `<span class="sn">${k+1}</span>` +
          `<span>${TITLES[k]}</span>` +
          (S[k].kind === "practice" ? `<span class="tk" aria-hidden="true">⌨</span>` : "");
        sb.onclick = () => { closeMenu(); go(k); };
        li.append(sb);
        ul.append(li);
      });
      wrap.append(ul);
    }
    host.append(wrap);
  });
}

/* --- focus containment for the modal sheet --- */
const FOCUSABLE = 'button:not([disabled]), a[href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])';
const bgRegions = () => ["h1.sr", ".rail", ".stage", ".nav"]
  .map(sel => document.querySelector(sel)).filter(Boolean);

function setBackgroundInert(on) {
  bgRegions().forEach(e => {
    if (on) { e.setAttribute("inert", ""); e.setAttribute("aria-hidden", "true"); }
    else { e.removeAttribute("inert"); e.removeAttribute("aria-hidden"); }
  });
}

/* wrap Tab at the ends, for browsers without `inert` */
sheet.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const f = Array.from(sheet.querySelectorAll(FOCUSABLE)).filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

function openMenu() {
  buildMenu();
  scrim.classList.add("open");
  menuBtn.setAttribute("aria-expanded", "true");
  setBackgroundInert(true);
  const first = sheet.querySelector(".sec.on .sub-btn.on") || sheet.querySelector(".sec-btn");
  if (first) first.focus();
  say("Sections menu open");
}
function closeMenu() {
  scrim.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
  setBackgroundInert(false);   /* must come before focus — the button lives in the background */
  menuBtn.focus();
}
menuBtn.onclick = openMenu;
document.getElementById("closeMenu").onclick = closeMenu;
scrim.addEventListener("click", e => { if (e.target === scrim) closeMenu(); });

document.getElementById("resetBtn").onclick = () => {
  st = { i:0, badges:[], solved:[] };
  save(); closeMenu(); draw();
  say("Progress reset");
};

draw();
</script>
